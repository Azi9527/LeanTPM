spring:
  application:
    name: leantpm-backend
  datasource:
    url: ${LEANTPM_DB_URL:jdbc:mysql://127.0.0.1:3306/leantpm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${LEANTPM_DB_USERNAME:root}
    password: ${LEANTPM_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: ${LEANTPM_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${LEANTPM_FLYWAY_BASELINE_ON_MIGRATE:false}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  address: ${LEANTPM_SERVER_ADDRESS:127.0.0.1}
  port: ${LEANTPM_SERVER_PORT:18080}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

springdoc:
  api-docs:
    enabled: ${LEANTPM_OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${LEANTPM_OPENAPI_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,diskSpace,releaseContract
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    version: ${LEANTPM_RELEASE_VERSION:1.0.3}
    database-schema-version: ${LEANTPM_DATABASE_SCHEMA_VERSION:52}

leantpm:
  security:
    jwt-secret: ${LEANTPM_JWT_SECRET:}
    access-token-minutes: ${LEANTPM_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${LEANTPM_REFRESH_TOKEN_DAYS:7}
    max-login-failures: ${LEANTPM_MAX_LOGIN_FAILURES:5}
    max-login-source-failures: ${LEANTPM_MAX_LOGIN_SOURCE_FAILURES:50}
    failure-window-minutes: ${LEANTPM_FAILURE_WINDOW_MINUTES:10}
    login-state-retention-minutes: ${LEANTPM_LOGIN_STATE_RETENTION_MINUTES:1440}
    session-state-retention-days: ${LEANTPM_SESSION_STATE_RETENTION_DAYS:30}
    security-cleanup-batch-size: ${LEANTPM_SECURITY_CLEANUP_BATCH_SIZE:500}
    cors-allowed-origins: ${LEANTPM_CORS_ALLOWED_ORIGINS:http://localhost:15173,http://127.0.0.1:15173,https://localhost,capacitor://localhost}
  bootstrap:
    admin-password: ${LEANTPM_BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    upload-dir: ${LEANTPM_UPLOAD_DIR:./var/uploads}
    max-file-bytes: 209715200
    allowed-extensions:
      - apk
      - jpg
      - jpeg
      - png
      - gif
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - zip
      - glb
      - gltf
  idempotency:
    processing-seconds: ${LEANTPM_IDEMPOTENCY_PROCESSING_SECONDS:300}
    completed-hours: ${LEANTPM_IDEMPOTENCY_COMPLETED_HOURS:24}
    max-response-bytes: ${LEANTPM_IDEMPOTENCY_MAX_RESPONSE_BYTES:8388608}
    cleanup-batch-size: ${LEANTPM_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}
