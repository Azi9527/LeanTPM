spring:
  application:
    name: leantpm-ops-control-plane
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 513MB

server:
  address: 127.0.0.1
  port: 18090
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Monitoring, automatic remediation and external notifications are opt-in.
# Production values belong in the protected external configuration file.
leantpm:
  ops:
    monitoring:
      # Read-only metrics from the machine running this control plane.
      host-resources-enabled: true
      enabled: false
      interval: 30s
    remediation:
      enabled: false
      failure-threshold: 3
      cooldown: 10m
      maximum-attempts-per-hour: 2
    notifications:
      pushplus:
        enabled: false
        allow-paid-channels: false
        timeout: 8s
        recipients: []
